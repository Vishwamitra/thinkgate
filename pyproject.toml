[project]
name = "thinkgate"
version = "0.1.0"
description = "Reverse proxy that detects and heals thinking-model responses silently emptied by exhausted token budgets"
readme = "README.md"
authors = [
    { name = "iVisdom", email = "iVisdom@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
thinkgate = "thinkgate:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
